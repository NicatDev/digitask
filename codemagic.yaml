# Codemagic CI/CD — DigiTask (Flutter iOS)

workflows:
  ios-flutter-release:
    name: DigiTask iOS (Flutter)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile

    integrations:
      app_store_connect: digitask

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.digigroup.ios

      vars:
        APP_STORE_APPLE_ID: "6760935006"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Debug provisioning profiles
        script: |
          echo "Available provisioning profiles:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Flutter build ipa
        script: |
          flutter build ipa --release --build-name=1.0.0 --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true