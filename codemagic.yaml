# Codemagic CI/CD — DigiTask (Flutter iOS)
#
# Apple hesabı: Diginet LLC (Team MCTUG52M88)
# Codemagic tələbləri (Team settings):
#   - Integrations → Developer Portal: API açarı "digitask-new"
#   - Code signing identities: Apple Distribution sertifikatı + com.digigroup.digitask üçün App Store profili

workflows:
  ios-flutter-release:
    name: DigiTask iOS (Flutter)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile

    integrations:
      app_store_connect: digitask-new

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.digigroup.digitask

      vars:
        APP_STORE_APPLE_ID: "6839693177"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean
        script: flutter clean

      - name: Setup signing
        script: |
          xcode-project use-profiles --verbose

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod repo update
          # Köhnə Podfile.lock Firebase 12.9 saxlayır; flutter firebase_core 12.12 tələb edəndə uyğunsuzluq yaranır.
          rm -f Podfile.lock
          pod install --repo-update

      - name: Set build number
        script: |
          # App Store Connect-dəki sonuncu build nömrəsi + 1 (heç build yoxdursa 1)
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          BUILD_NUMBER=$(( ${LATEST:-0} + 1 ))
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Build IPA
        script: |
          flutter build ipa --release --build-name=1.0.0 --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # İlk mərhələ: build yalnız App Store Connect-ə yüklənir (daxili TestFlight).
        # Xarici beta və mağazaya göndərmə, mağaza məlumatları doldurulandan sonra açılacaq.
        submit_to_testflight: false
        submit_to_app_store: false
