# Codemagic CI/CD — DigiTask (Flutter iOS)
#
# Dashboard → Code signing identities: remove extra provisioning profiles; keep only digitask_app.

workflows:
  ios-flutter-release:
    name: DigiTask iOS (Flutter)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile

    integrations:
      app_store_connect: digitask

    environment:
      ios_signing:
        provisioning_profiles:
          - digitask
       
      vars:
        APP_STORE_APPLE_ID: "6760935006"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean
        script: flutter clean

      - name: Setup signing
        script: |
          xcode-project use-profiles --verbose

      - name: Debug provisioning profiles
        script: |
          echo "Available provisioning profiles:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod repo update
          # Köhnə Podfile.lock Firebase 12.9 saxlayır; flutter firebase_core 12.12 tələb edəndə uyğunsuzluq yaranır.
          rm -f Podfile.lock
          pod install --repo-update

      - name: Set build number
        script: |
          BUILD_NUMBER=14
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Build IPA
        script: |
          flutter pub get
          flutter build ipa --release --build-name=1.0.0 --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
