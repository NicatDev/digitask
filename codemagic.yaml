# Codemagic CI/CD — DigiTask (Flutter iOS)
#
# Before the first successful build:
# 1. Codemagic → Team settings → Integrations → add App Store Connect API key.
#    Use the same "reference name" in `integrations.app_store_connect` below (default: codemagic).
# 2. Codemagic → codemagic.yaml settings → Code signing identities:
#    iOS certificate + App Store provisioning profile for bundle id com.digigroup.ios
# 3. Application Apple ID: App Store Connect → your app → General → App Information → Apple ID
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-flutter-release:
    name: DigiTask iOS (Flutter)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: digitask
    environment:
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.digigroup.ios
      vars:
        APP_STORE_APPLE_ID: "6760935006"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Set to true after TestFlight beta groups exist in App Store Connect
        submit_to_testflight: true
        submit_to_app_store: true
